      discovery_rules:
        - uuid: 26f33002a94d4da1924f6ab278c79956
          name: 'Printer unit discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SUP_DESC},1.3.6.1.2.1.43.11.1.1.6]'
          key: prtMarkerSuppliesUnit
          delay: 1h
          filter:
            conditions:
              - macro: '{#SUP_DESC}'
                value: '.*([Bb]elt|[Dd]rum).*'
                operator: MATCHES_REGEX
          item_prototypes:
            - uuid: 69267e2f19a24b26aee362931af92374
              name: 'Unit level [%] – [{#SUP_DESC}]'
              type: CALCULATED
              key: 'printer.unit.level.pct[{#SNMPINDEX}]'
              value_type: UNSIGNED
              units: '%'
              params: 'last(//printer.unit.level.raw[{#SNMPINDEX}])+(last(//printer.unit.max.raw[{#SNMPINDEX}])/1000000)'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var n=Number(value);if(!isFinite(n)||n<0)return 0;var level=Math.floor(n+1e-9);var max=Math.round((n-level)*1000000);if(max<=0)return level<=100?level:0;var pct=Math.round(100*level/max);if(pct<0)return 0;if(pct>100)return 100;return pct;'
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: unit
              trigger_prototypes:
                - uuid: 7f6c3d87e8dc49488bb2852a705b38df
                  expression: 'last(/Brother MFC-L9570CDW/printer.unit.level.pct[{#SNMPINDEX}])<10'
                  name: 'Unit low – [{#SUP_DESC}] < 10%'
                  priority: WARNING
                  tags:
                    - tag: component
                      value: health
                    - tag: resource
                      value: unit
                - uuid: 0c1a5849036b4e8ca4053c0520d6e4ce
                  expression: 'last(/Brother MFC-L9570CDW/printer.unit.level.pct[{#SNMPINDEX}])<5'
                  name: 'Unit very low – [{#SUP_DESC}] < 5%'
                  priority: HIGH
                  description: 'A Printer-MIB level of -1, -2, or -3 is stored as 0%. That covers a missing unit and an unknown level, which used to keep the previous percentage.'
                  tags:
                    - tag: component
                      value: health
                    - tag: resource
                      value: unit
            - uuid: 8d3500ab67054db591a8f4b8cadb5c8e
              name: 'Unit level (raw) – [{#SUP_DESC}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}'
              key: 'printer.unit.level.raw[{#SNMPINDEX}]'
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var v=parseInt(value,10);if(isNaN(v))return 0;if(v>2147483647)v=v-4294967296;if(v<0)return 0;return v;'
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: unit
            - uuid: 95b90ae4672b429bbac42084e0f037f3
              name: 'Unit max capacity (raw) – [{#SUP_DESC}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}'
              key: 'printer.unit.max.raw[{#SNMPINDEX}]'
              value_type: FLOAT
              preprocessing:
                - type: DISCARD_UNCHANGED
                - type: JAVASCRIPT
                  parameters:
                    - 'var v=parseInt(value,10);if(isNaN(v))return 0;if(v>2147483647)v=v-4294967296;if(v<=0)return 0;return v;'
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: unit
          graph_prototypes:
            - uuid: 9ee30809b8654735a541a854a58d37a8
              name: 'Unit level [%] – [{#SUP_DESC}]'

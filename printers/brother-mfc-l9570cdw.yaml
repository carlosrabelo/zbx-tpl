zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 8003587ac30341048e9448afee76d37b
      template: 'Brother MFC-L9570CDW'
      name: 'Brother MFC-L9570CDW'
      description: 'Color toner comes from the remaining-life fields in Brother brInfoMaintenance, in hundredths of a percent. The coarse gauge on that object can stay at 100% when a cartridge is empty or removed, so it is used only when the remaining-life field is absent. A color missing from the reading is stored as 0%. Belt and drum come from Printer-MIB.'
      templates:
        - name: 'Generic by SNMP'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 8bb14cd905744cd883ebb5ecfbef8cc5
          name: 'Toner levels'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2435.2.3.9.4.2.1.5.5.8.0
          key: printer.maintenance.raw
          delay: 1h
          value_type: TEXT
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var hex = String(value).replace(/[^0-9a-fA-F]/g, '');
                  var remain = {111: 'black', 112: 'cyan', 113: 'magenta', 114: 'yellow'};
                  var coarse = {129: 'black', 130: 'cyan', 131: 'magenta', 132: 'yellow'};
                  var out = {};
                  var seen = {};
                  var b = [];
                  var clean = [];
                  var i;
                  var id;
                  var raw;
                  var name;
                  if (hex.length < 14 || hex.length % 2) return JSON.stringify(out);
                  for (i = 0; i < hex.length; i += 2) b.push(parseInt(hex.substr(i, 2), 16));
                  for (i = 0; i < b.length; i++) {
                    if (i + 3 < b.length && b[i] === 255 && b[i + 1] === 255 && b[i + 2] === 255 && b[i + 3] === 255) break;
                    if (i + 2 < b.length && b[i] === 255 && b[i + 1] === 255 && b[i + 2] === 255) {
                      i += 2;
                      continue;
                    }
                    clean.push(b[i]);
                  }
                  for (i = 0; i + 6 < clean.length; i++) {
                    if (clean[i + 1] !== 1 || clean[i + 2] !== 4) continue;
                    id = clean[i];
                    raw = (clean[i + 3] * 16777216) + (clean[i + 4] * 65536) + (clean[i + 5] * 256) + clean[i + 6];
                    name = remain[id];
                    if (name) {
                      out[name] = Math.max(0, Math.min(100, Math.round(raw / 100)));
                      seen[name] = 1;
                    } else if (coarse[id] && !seen[coarse[id]] && raw <= 100) {
                      out[coarse[id]] = raw;
                      seen[coarse[id]] = 1;
                    }
                    i += 6;
                  }
                  return JSON.stringify(out);
          tags:
            - tag: component
              value: health
            - tag: resource
              value: toner
        - uuid: c8e7d023f55a447c84ff7eb0f6fe3c53
          name: 'Toner level [%] – Black'
          type: DEPENDENT
          key: 'printer.toner.level.pct[black]'
          delay: '0'
          value_type: UNSIGNED
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.black'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: printer.maintenance.raw
          tags:
            - tag: component
              value: health
            - tag: resource
              value: toner
          triggers:
            - uuid: ee4ae506f7554952971f1e60c208b072
              expression: 'last(/Brother MFC-L9570CDW/printer.toner.level.pct[black])<10'
              name: 'Toner low – Black < 10%'
              priority: WARNING
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: toner
            - uuid: 0e03aeec695a4834bbe312d0fdb05678
              expression: 'last(/Brother MFC-L9570CDW/printer.toner.level.pct[black])<5'
              name: 'Toner very low – Black < 5%'
              priority: HIGH
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: toner

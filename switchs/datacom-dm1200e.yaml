        - uuid: a9b16455922e47b2a3cc3dd223e8bf66
          name: 'Temperature sensor discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#TEMP},1.3.6.1.4.1.4413.1.1.43.1.8.1.5]'
          key: sensor.temp.discovery
          delay: 1h
          description: |
            FASTPATH boxServices temperature table. On firmware 4.0.0.73 the index is unit.sensor.
            Sensor 1.0 is the CPU temperature. Sensor 1.1 is the second chassis sensor.
          item_prototypes:
            - uuid: 7b83a49b9e864779a1ecb9a810774c2a
              name: 'Temperature [{#SNMPINDEX}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.4413.1.1.43.1.8.1.5.{#SNMPINDEX}'
              key: 'sensor.temp.value[{#SNMPINDEX}]'
              value_type: FLOAT
              units: '°C'
              description: 'MIB: FASTPATH-BOXSERVICES-PRIVATE-MIB temperature column. Index {#SNMPINDEX}.'
              tags:
                - tag: component
                  value: temperature
              trigger_prototypes:
                - uuid: b27da4e99691412bb8150e1493ed4ce3
                  expression: 'min(/Datacom DM1200E by SNMP/sensor.temp.value[{#SNMPINDEX}],5m)>{$TEMP.MAX}'
                  name: 'Temperature [{#SNMPINDEX}] is above {$TEMP.MAX}°C'
                  priority: HIGH
                  description: 'The sensor stayed above {$TEMP.MAX}°C for 5 minutes.'
            - uuid: 1923744690b64645ad03b6f7fb0ead6c
              name: 'Temperature [{#SNMPINDEX}]: State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.4413.1.1.43.1.8.1.4.{#SNMPINDEX}'
              key: 'sensor.temp.state[{#SNMPINDEX}]'
              value_type: UNSIGNED
              description: 'Sensor state. 1 normal, 2 warning, 3 critical, 4 shutdown, 5 not present, 6 not operational.'
              valuemap:
                name: 'Temperature state'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: temperature
              trigger_prototypes:
                - uuid: 37bb89ef665143da82002ad4e7b81a32
                  expression: 'last(/Datacom DM1200E by SNMP/sensor.temp.state[{#SNMPINDEX}])>1 and last(/Datacom DM1200E by SNMP/sensor.temp.state[{#SNMPINDEX}])<>5'
                  name: 'Temperature [{#SNMPINDEX}]: Sensor is not normal'
                  priority: HIGH
                  description: 'The sensor reports warning, critical, shutdown, or not operational.'
          graph_prototypes:
            - uuid: c297e12b58c9490296babe228e4701c6
              name: 'Temperature [{#SNMPINDEX}]'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              yaxismin: '0'
              yaxismax: '100'
              graph_items:

                    key: 'sensor.temp.value[{#SNMPINDEX}]'
        - uuid: e2b6648ea7b3415483aa5b64ba615d41
          name: 'Fan discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FANINDEX},1.3.6.1.4.1.4413.1.1.43.1.6.1.1]'
          key: sensor.fan.discovery
          delay: 1h
          description: |
            FASTPATH boxServices fan table. Index is unit.fan.
            On this chassis, fans 1.0–1.2 report operational and fan 1.3 reports not present. Only failed(3) opens a problem.
          item_prototypes:
            - uuid: 65855a2075c044ef9ec645c507e9f768
              name: 'Fan [{#SNMPINDEX}]: State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.4413.1.1.43.1.6.1.3.{#SNMPINDEX}'
              key: 'sensor.fan.state[{#SNMPINDEX}]'
              value_type: UNSIGNED
              description: 'MIB: boxServicesFanItemState. 1 not present, 2 operational, 3 failed.'
              valuemap:
                name: 'Service state'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: fan
              trigger_prototypes:
                - uuid: b67370c8ef37431abd76715c7d447797
                  expression: 'last(/Datacom DM1200E by SNMP/sensor.fan.state[{#SNMPINDEX}])=3'
                  name: 'Fan [{#SNMPINDEX}] failed'
                  priority: HIGH
                  description: 'The fan reports failed.'
        - uuid: 585a6405b2644c239dfade9d5fd1b8e7
          name: 'Power supply discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#PSUINDEX},1.3.6.1.4.1.4413.1.1.43.1.7.1.1]'
          key: sensor.psu.discovery
          delay: 1h
          description: |
            FASTPATH boxServices power-supply table. Index is unit.psu.
            On this standalone chassis one supply reports operational and the second reports not present. Only failed(3) opens a problem.
          item_prototypes:
            - uuid: 82f85f98be944ffbbcb7696ccc440607
              name: 'Power supply [{#SNMPINDEX}]: State'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.4413.1.1.43.1.7.1.3.{#SNMPINDEX}'
              key: 'sensor.psu.state[{#SNMPINDEX}]'
              value_type: UNSIGNED
              description: 'MIB: boxServicesPowSupplyItemState. 1 not present, 2 operational, 3 failed.'
              valuemap:
                name: 'Service state'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: power
              trigger_prototypes:
                - uuid: 94dfbea324a24801bfe914a549b09e02
                  expression: 'last(/Datacom DM1200E by SNMP/sensor.psu.state[{#SNMPINDEX}])=3'
                  name: 'Power supply [{#SNMPINDEX}] failed'
                  priority: HIGH
                  description: 'The power supply reports failed.'
        - uuid: 66a753701200474486e983edc05da594
          name: 'PoE port discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#POESTATUS},1.3.6.1.2.1.105.1.1.1.6]'
          key: poe.port.discovery
          delay: 1h
          description: 'POWER-ETHERNET-MIB::pethPsePortDetectionStatus. The index is group.port. The 24 copper ports are 1.1–1.24. Searching is normal for an idle port; only fault states open a problem.'
          item_prototypes:
            - uuid: 920c4af3cbb54812b986bf19a4bbeea3
              name: 'PoE port [{#SNMPINDEX}]: Detection status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.105.1.1.1.6.{#SNMPINDEX}'
              key: 'poe.port.status[{#SNMPINDEX}]'
              value_type: UNSIGNED
              description: '1 disabled, 2 searching, 3 delivering power, 4 fault, 5 test, 6 other fault.'
              valuemap:
                name: 'PoE detection status'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: power
                - tag: interface
                  value: '{#SNMPINDEX}'
              trigger_prototypes:
                - uuid: fbd1c0a04a4a43b0ab189041eae0e840
                  expression: 'last(/Datacom DM1200E by SNMP/poe.port.status[{#SNMPINDEX}])=4 or last(/Datacom DM1200E by SNMP/poe.port.status[{#SNMPINDEX}])=6'
                  name: 'PoE port [{#SNMPINDEX}]: Fault'
                  priority: WARNING
                  description: 'The port reports a PoE fault or other fault.'

zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 8003587ac30341048e9448afee76d37b
      template: 'Brother MFC-L9570CDW'
      name: 'Brother MFC-L9570CDW'
      description: 'Color toner comes from Brother brInfoMaintenance. Belt and drum come from Printer-MIB.'
      templates:
        - name: 'Generic by SNMP'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 8bb14cd905744cd883ebb5ecfbef8cc5
          name: 'Maintenance info'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2435.2.3.9.4.2.1.5.5.8.0
          key: printer.maintenance.raw
          delay: 1h
          value_type: TEXT
          tags:
            - tag: component
              value: health
            - tag: resource
              value: toner
      discovery_rules:
        - uuid: d8d3836dfea8475e9b8f0e1acf41ffd9
          name: 'Printer supplies discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SUP_DESC},1.3.6.1.2.1.43.11.1.1.6]'
          key: prtMarkerSuppliesLevel
          delay: 1h
          filter:
            conditions:
              - macro: '{#SUP_DESC}'
                value: '.*([Cc]artridge|[Tt]oner).*'
                operator: MATCHES_REGEX
              - macro: '{#SUP_DESC}'
                value: '.*[Ww]aste.*'
                operator: NOT_MATCHES_REGEX
          item_prototypes:
            - uuid: ec39e88c3b3e4e6aaa5a0ba5670ca2cc
              name: 'Toner level [%] – [{#SUP_DESC}]'
              type: DEPENDENT
              key: 'printer.toner.level.pct[{#SNMPINDEX}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = '{#SUP_DESC}'.toLowerCase();
                      var id = 0;
                      if (d.indexOf('black') >= 0) id = 0x81;
                      else if (d.indexOf('cyan') >= 0) id = 0x82;
                      else if (d.indexOf('magenta') >= 0) id = 0x83;
                      else if (d.indexOf('yellow') >= 0) id = 0x84;
                      if (!id) return null;
                      var hex = String(value).replace(/[^0-9a-fA-F]/g, '');
                      if (hex.length < 14 || hex.length % 2) return null;
                      var b = [];
                      var i;
                      for (i = 0; i < hex.length; i += 2) b.push(parseInt(hex.substr(i, 2), 16));
                      for (i = 0; i + 6 < b.length; i++) {
                        if (b[i] === id && b[i + 1] === 1 && b[i + 2] === 4) {
                          var pct = b[i + 6];
                          return (pct <= 100) ? pct : null;
                        }
                      }
                      return null;
              master_item:
                key: printer.maintenance.raw
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: toner
              trigger_prototypes:
                - uuid: f318bcc352f74ee7a22b388ac161820c
                  expression: 'last(/Brother MFC-L9570CDW/printer.toner.level.pct[{#SNMPINDEX}])<10'
                  name: 'Toner low – [{#SUP_DESC}] < 10%'
                  priority: WARNING
                  tags:
                    - tag: component
                      value: health
                    - tag: resource
                      value: toner
                - uuid: 57e8960348514726953895248a2b6259
                  expression: 'last(/Brother MFC-L9570CDW/printer.toner.level.pct[{#SNMPINDEX}])<5'
                  name: 'Toner very low – [{#SUP_DESC}] < 5%'
                  priority: HIGH
                  tags:
                    - tag: component
                      value: health
                    - tag: resource
                      value: toner
          graph_prototypes:
            - uuid: e5de0b691a174332b9bc0402c56c7fa6
              name: 'Toner level [%] – [{#SUP_DESC}]'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              yaxismin: '0'
              yaxismax: '100'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  item:
                    host: 'Brother MFC-L9570CDW'
                    key: 'printer.toner.level.pct[{#SNMPINDEX}]'
        - uuid: 26f33002a94d4da1924f6ab278c79956
          name: 'Printer unit discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#SUP_DESC},1.3.6.1.2.1.43.11.1.1.6]'
          key: prtMarkerSuppliesUnit
          delay: 1h
          filter:
            conditions:
              - macro: '{#SUP_DESC}'
                value: '.*([Bb]elt|[Dd]rum).*'
                operator: MATCHES_REGEX
          item_prototypes:
            - uuid: 69267e2f19a24b26aee362931af92374
              name: 'Unit level [%] – [{#SUP_DESC}]'
              type: CALCULATED
              key: 'printer.unit.level.pct[{#SNMPINDEX}]'
              value_type: FLOAT
              units: '%'
              params: '100*last(//printer.unit.level.raw[{#SNMPINDEX}])/(last(//printer.unit.max.raw[{#SNMPINDEX}])+0.000001)'
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: unit
              trigger_prototypes:
                - uuid: 7f6c3d87e8dc49488bb2852a705b38df
                  expression: 'last(/Brother MFC-L9570CDW/printer.unit.level.pct[{#SNMPINDEX}])<10'
                  name: 'Unit low – [{#SUP_DESC}] < 10%'
                  priority: WARNING
                  tags:
                    - tag: component
                      value: health
                    - tag: resource
                      value: unit
                - uuid: 0c1a5849036b4e8ca4053c0520d6e4ce
                  expression: 'last(/Brother MFC-L9570CDW/printer.unit.level.pct[{#SNMPINDEX}])<5'
                  name: 'Unit very low – [{#SUP_DESC}] < 5%'
                  priority: HIGH
                  tags:
                    - tag: component
                      value: health
                    - tag: resource
                      value: unit
            - uuid: 8d3500ab67054db591a8f4b8cadb5c8e
              name: 'Unit level (raw) – [{#SUP_DESC}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.43.11.1.1.9.{#SNMPINDEX}'
              key: 'printer.unit.level.raw[{#SNMPINDEX}]'
              value_type: FLOAT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'return (value < 0 || value >= 200000) ? null : value;'
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: unit
            - uuid: 95b90ae4672b429bbac42084e0f037f3
              name: 'Unit max capacity (raw) – [{#SUP_DESC}]'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.43.11.1.1.8.{#SNMPINDEX}'
              key: 'printer.unit.max.raw[{#SNMPINDEX}]'
              value_type: FLOAT
              preprocessing:
                - type: DISCARD_UNCHANGED
                - type: JAVASCRIPT
                  parameters:
                    - 'return (value <= 0 || value >= 200000) ? null : value;'
              tags:
                - tag: component
                  value: health
                - tag: resource
                  value: unit
          graph_prototypes:
            - uuid: 9ee30809b8654735a541a854a58d37a8
              name: 'Unit level [%] – [{#SUP_DESC}]'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              yaxismin: '0'
              yaxismax: '100'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 2774A6
                  item:
                    host: 'Brother MFC-L9570CDW'
                    key: 'printer.unit.level.pct[{#SNMPINDEX}]'
